enable
configure terminal
hostname S2
ip routing
ipv6 unicast-routing
router ospf 1
 router-id 11.11.11.11
 exit
ipv6 router ospf 1
 router-id 11.11.11.11
 exit
interface fa0/1
 description Link to R1 g0/0/0
 no switchport
 ip address 10.0.0.2 255.255.255.252
 ip ospf 1 area 0
 ipv6 address 2001:db8:0:1::2/64
 ipv6 ospf 1 area 0
 no shutdown
 exit
interface fa0/2
 description Link to R2 g0/0/1
 no switchport
 ip address 10.0.0.5 255.255.255.252
 ip ospf 1 area 0
 ipv6 address 2001:db8:0:2::1/64
 ipv6 ospf 1 area 0
 no shutdown
 exit
interface fa0/10
 description Link to R4 g0/0/0
 no switchport
 ip address 192.168.20.1 255.255.255.0
 ip ospf 1 area 2
 ipv6 address 2001:db8:2:1::2/64
 ipv6 ospf 1 area 2
 no shutdown
 exit
end
show running-config
show ip ospf neighbor
show ipv6 ospf neighbor
